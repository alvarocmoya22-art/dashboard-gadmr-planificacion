name: Diagnóstico eGob

on:
  workflow_dispatch:
    inputs:
      issues:
        description: 'Números eGob separados por coma (ej: 914830,295460,1155221)'
        required: true
        default: '914830'
      mode:
        description: 'full (parseo) o raw (pistas del HTML crudo)'
        required: false
        default: 'full'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Ejecutar diagnostico eGob
        run: node scripts/egob-diagnose.mjs
        env:
          DIAG_ISSUES: ${{ inputs.issues }}
          DIAG_MODE: ${{ inputs.mode }}
          EGOB_USERNAME: ${{ secrets.EGOB_USERNAME }}
          EGOB_PASSWORD: ${{ secrets.EGOB_PASSWORD }}
          EGOB_BASE_URL: ${{ secrets.EGOB_BASE_URL }}
          EGOB_LOGIN_URL: ${{ secrets.EGOB_LOGIN_URL }}
          EGOB_TLS_REJECT_UNAUTHORIZED: ${{ secrets.EGOB_TLS_REJECT_UNAUTHORIZED }}
